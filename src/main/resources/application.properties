spring.application.name=realtime-devboard

# Code Execution Engine sandbox limits (see README "Saugumo ribos")
devboard.execution.image=${EXECUTION_IMAGE:eclipse-temurin:21-jdk}
devboard.execution.run-timeout=7s
devboard.execution.compile-timeout=15s
devboard.execution.memory=256m
devboard.execution.java-heap=128m
devboard.execution.cpus=0.5
devboard.execution.pids-limit=128
devboard.execution.workdir-size=16m
devboard.execution.output-limit-bytes=65536
devboard.execution.max-code-bytes=65536
devboard.execution.max-concurrent=2

